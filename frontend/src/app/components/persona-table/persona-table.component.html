<section aria-label="Listado de personas">
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th scope="col">Nombre</th>
          <th scope="col">Teléfono</th>
        </tr>
      </thead>
      <tbody>
        @for (persona of personas(); track persona.id) {
          <tr
            class="person-row"
            tabindex="0"
            [attr.aria-label]="'Ver detalle de ' + nombreCompleto(persona)"
            (click)="detalle.emit(persona)"
            (keydown.enter)="detalle.emit(persona)"
            (keydown.space)="$event.preventDefault(); detalle.emit(persona)"
          >
            <td>
              <div class="person-cell">
                <span class="avatar" aria-hidden="true">{{ persona.nombre.charAt(0) }}</span>
                <strong>{{ nombreCompleto(persona) }}</strong>
              </div>
            </td>
            <td>
              <a
                class="phone-link"
                [href]="'tel:' + persona.telefono"
                (click)="$event.stopPropagation()"
                (keydown)="$event.stopPropagation()"
                >{{ persona.telefono }}</a
              >
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="2" class="empty-state">No hay personas para mostrar.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
