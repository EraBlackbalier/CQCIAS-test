<section aria-label="Listado de personas">
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th scope="col">Persona</th>
          <th scope="col">Teléfono</th>
          <th scope="col">Estado</th>
          <th scope="col"><span class="visually-hidden">Acciones</span></th>
        </tr>
      </thead>
      <tbody>
        @for (persona of personas(); track persona.id) {
          <tr>
            <td>
              <div class="person-cell">
                <span class="avatar" aria-hidden="true">{{ persona.nombre.charAt(0) }}</span>
                <strong>{{ nombreCompleto(persona) }}</strong>
              </div>
            </td>
            <td>
              <a class="phone-link" [href]="'tel:' + persona.telefono">{{ persona.telefono }}</a>
            </td>
            <td><span class="status-badge">Activa</span></td>
            <td class="action-cell">
              <button
                type="button"
                class="detail-button"
                [attr.aria-label]="'Ver detalle de ' + nombreCompleto(persona)"
                (click)="detalle.emit(persona)"
              >
                Ver detalle
              </button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="empty-state">No hay personas para mostrar.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
