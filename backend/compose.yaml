services:
  mysql:
    build:
      context: ./mysql
    container_name: cqcias-mysql
    environment:
      MYSQL_DATABASE: cqcias
      MYSQL_USER: cqcias
      MYSQL_PASSWORD: cqcias
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
    container_name: cqcias-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/cqcias
      DB_USER: cqcias
      DB_PASSWORD: cqcias
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
