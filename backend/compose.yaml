services:
  mysql:
    image: mysql:8.4
    container_name: cqcias-mysql
    environment:
      MYSQL_DATABASE: cqcias
      MYSQL_USER: cqcias
      MYSQL_PASSWORD: cqcias
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
